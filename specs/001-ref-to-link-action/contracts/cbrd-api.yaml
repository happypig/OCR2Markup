openapi: 3.1.0
info:
  title: CBRD API
  description: |
    External API provided by CBETA/DILA for converting Tripitaka references to CBETA Online URLs.

    **Vendored copy.** This file is the repository's record of the contract the plugin is built
    against. It is not documentation-only: `CBRDContractConformanceTest` reads `info.version` here
    and asserts it against `CBRDAPIClient.CONTRACT_VERSION`, so a divergence fails the build.

    **History.** Until 2026-08-03 this file declared v1.0.0 with `GET /link?q=<xml>`. The live
    service had moved to v1.1.0 (`POST /link` with a JSON body) and no longer routed the GET, so
    every Ref-to-Link conversion failed with a routing 404 while the test suite stayed green —
    the suite asserted the v1.0.0 shape. See `exploration/ref2link_drift.md` and
    `specs/005-cbrd-link-v11/`.

    **Authentication**: none for `/link` in v1.1.0. The `Referer: CBRD@dila.edu.tw` header that
    v1.0.0 required is still sent by the plugin and still accepted, but is no longer mandatory.
  version: 1.1.0
  contact:
    name: DILA (Dharma Drum Institute of Liberal Arts)
    url: https://cbss.dila.edu.tw

servers:
  - url: https://cbss.dila.edu.tw/cbrd
    description: Production server

paths:
  /link:
    post:
      summary: Generate CBETA link(s) from <ref> XML in the request body
      description: |
        Accepts an XML-formatted Tripitaka reference in a JSON request body and returns the
        corresponding CBETA Online URLs.

        **Request requirements**:
        - Body member `q` contains the raw `<ref>` XML. It is NOT URL-encoded — quotes, CJK
          characters and full-width punctuation are content and must survive verbatim.
        - `Content-Type: application/json` (or `application/x-www-form-urlencoded`).

        **Response behaviour**: the endpoint always answers HTTP 200 for anything that reaches
        the handler. The outcome is carried in the payload, never in the transport status:
        - `success: true` with a non-empty `found` — resolved.
        - `success: true` with an empty `found` — no match.
        - `success: false` with `msg` or `error` — the service could not process the citation.

        A non-2xx from this path therefore indicates a transport, routing or infrastructure
        fault, not a citation-level result.

      operationId: postCbetaLink
      tags:
        - Reference Conversion

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRequest'
            examples:
              minimal:
                summary: Minimal reference (canon and volume only)
                value:
                  q: '<ref><canon>T</canon><v>25</v></ref>'
              complete:
                summary: Complete reference, resolves to a single URL
                value:
                  q: '<ref><canon>T</canon><v>4</v><w>202</w><p>376</p><c>b</c><l>4</l></ref>'
              cjk_with_attribute:
                summary: Traditional Chinese canon name with a quoted attribute and a column range
                value:
                  q: '<ref xml:id="r26"><canon>大正</canon><v>二九</v>、<p>一</p><c>下</c>―<p>二</p><c>上</c></ref>'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkRequest'

      responses:
        '200':
          $ref: '#/components/responses/LinkResponse'

components:
  schemas:
    LinkRequest:
      type: object
      description: One citation submitted for resolution.
      required:
        - q
      properties:
        q:
          type: string
          description: Raw <ref> XML string, transmitted verbatim.
          example: '<ref><canon>T</canon><v>25</v></ref>'
      additionalProperties: false

    LinkSuccess:
      type: object
      description: The service processed the citation. `found` may be empty, meaning no match.
      required:
        - success
        - found
      properties:
        success:
          type: boolean
          const: true
        found:
          type: array
          description: CBETA Online URLs. Empty array means no matching reference.
          items:
            type: string
            format: uri
          example:
            - 'https://cbetaonline.dila.edu.tw/T04n0202_p0376b04'
      additionalProperties: false

    LinkFailure:
      type: object
      description: The service could not process the citation. Still returned as HTTP 200.
      required:
        - success
      properties:
        success:
          type: boolean
          const: false
        msg:
          type: string
          example: '經號或頁碼 至少要有一個'
        error:
          type: string
          example: 'no matching reference'
      anyOf:
        - required: [msg]
        - required: [error]
      additionalProperties: false

    LinkResponse:
      oneOf:
        - $ref: '#/components/schemas/LinkSuccess'
        - $ref: '#/components/schemas/LinkFailure'

  responses:
    LinkResponse:
      description: |
        Always returns HTTP 200 regardless of internal processing result; consult the `success`
        field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LinkResponse'
          examples:
            resolved:
              summary: Resolved to a CBETA Online URL
              value:
                success: true
                found:
                  - 'https://cbetaonline.dila.edu.tw/T04n0202_p0376b04'
            no_match:
              summary: Processed, but nothing matched
              value:
                success: true
                found: []
            failure_msg:
              summary: Could not process the citation (msg variant)
              value:
                success: false
                msg: '經號或頁碼 至少要有一個'
            failure_error:
              summary: Could not process the citation (error variant)
              value:
                success: false
                error: 'no matching reference'

tags:
  - name: Reference Conversion
    description: Convert Tripitaka references to CBETA Online URLs

externalDocs:
  description: CBETA Online
  url: https://cbetaonline.dila.edu.tw
